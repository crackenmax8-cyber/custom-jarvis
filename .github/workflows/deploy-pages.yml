name: Deploy to GitHub Pages

# Publishes the static JARVIS HUD to GitHub Pages so it can be opened over HTTPS
# (which the microphone / Web Speech API requires).

on:
  push:
    branches:
      - claude/jarvis-project-dashboard-v8iss8
      - main
  workflow_dispatch: # lets you re-run the deploy manually from the Actions tab

# Permissions the deploy needs (and only those).
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Enables Pages (source = GitHub Actions) on first run if not already set.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The whole repo root is the site (index.html lives at the top level).
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
